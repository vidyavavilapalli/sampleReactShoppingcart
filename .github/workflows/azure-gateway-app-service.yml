name: Deploy Express gateway to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/azure-gateway-app-service.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare gateway package
        run: |
          mkdir -p .azure-deploy/api
          cp server.js package.json package-lock.json .azure-deploy/api/
          npm ci --omit=dev --prefix .azure-deploy/api

      - name: Deploy gateway
        uses: Azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .azure-deploy/api
