name: Deploy React app to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "my-react-app/**"
      - ".github/workflows/azure-static-web-app.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci --prefix my-react-app

      - name: Build frontend
        run: npm run build --prefix my-react-app
        env:
          REACT_APP_LOGIN_API_URL: ${{ vars.LOGIN_API_URL }}

      - name: Deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: my-react-app/build
          api_location: ""
          output_location: ""
          skip_app_build: true
